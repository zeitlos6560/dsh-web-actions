name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    name: offline tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The suite needs no DSH, no browser, and no dependencies: it drives the
      # route handler and the engines with fakes. Each file also runs on its own
      # and prints one PASS/FAIL line per case.
      - name: Run the offline regression tests
        run: node --test test/
